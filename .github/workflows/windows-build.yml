name: Windows build

# The same one-shot script used on a Windows desktop
# (packaging/build_installer.py): stamp VERSION, freeze with PyInstaller,
# zip, compile the Inno Setup installer. Lets a release be cut from a Mac:
# run this and macos-build.yml on the same commit so both platforms carry
# the same <major>.<minor>.<commits>.
#
# This workflow only BUILDS. It uploads the installer, the portable zip and
# the stable-name copy as a workflow artifact and never creates a release:
# the v<ver> release becomes `releases/latest`, which the website's download
# button points at, so it is created by hand after the build is checked.
#
# Development happens on `dev`, not on the default branch, and GitHub only
# lists workflow_dispatch workflows that exist on the default branch — so
# the trigger is a tag push, which runs the workflow file of the tagged
# commit wherever it lives. The tag is also the release tag later:
#
#   git tag v0.26.N && git push origin v0.26.N
#
# (`v*` does not match `macos-v*`: tag patterns are anchored at the start.)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45    # a hung test must not hold a runner for 6 hours

    steps:
      - uses: actions/checkout@v4
        with:
          # The version is `git rev-list --count HEAD`, so a shallow
          # clone would silently ship the wrong build number.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          python -c "import PySide6, faster_whisper, ctranslate2, onnxruntime, sounddevice, soundfile, pymupdf; print('PySide6', PySide6.__version__)"

      - name: Install Inno Setup
        # Not guaranteed on the runner image; choco is. build_installer.py
        # finds it under Program Files (x86).
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Fetch tectonic and warm the offline TeX cache
        # The pinned official tectonic, and a cache of exactly what the
        # example notes need (both layouts), bundled by the spec. On PATH
        # too, so the tests that really typeset run here as well.
        shell: bash
        run: |
          python packaging/fetch_tectonic.py --warm
          echo "$PWD/packaging/bin" >> "$GITHUB_PATH"

      - name: Fetch KhervePDF and install its requirements
        # KhervePDF ships inside KherveNote (packaging/build_khervepdf.py
        # pins the commit); the build script freezes it after KherveNote.
        shell: bash
        run: |
          python -c "import sys; sys.path.insert(0, 'packaging'); import build_khervepdf as b; b.source()"
          # --prefer-binary: the newest pikepdf may have no wheel for a
          # runner yet (macos-14 tried to compile it and failed on qpdf).
          pip install --prefer-binary -r build/khervepdf-src/requirements.txt

      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

      - name: Build the installer and portable zip
        run: python packaging/build_installer.py

      - name: Read the version back
        shell: bash
        run: |
          VERSION=$(cut -d+ -f1 khervenote/VERSION | tr -d '\r\n')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check the build
        # Checks what a freeze breaks: a bad version, a missing exe, the
        # manual, tectonic and its TeX cache, the voice detector model.
        shell: bash
        run: |
          set -euo pipefail
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          test -f dist/KherveNote/KherveNote.exe
          find dist/KherveNote -name 'manual.md' | grep -q .
          find dist/KherveNote -name tectonic.exe | grep -q .
          test -d dist/KherveNote/_internal/khervenote/tectonic_cache
          find dist/KherveNote -name 'silero*.onnx' | grep -q .
          test -f dist/KherveNote/KhervePDF/KhervePDF.exe
          du -sh dist/KherveNote
          ls -lh dist/KherveNote-Setup-$VERSION.exe dist/KherveNote-$VERSION-portable.zip \
                 dist/KherveNote-Setup.exe

      - name: Smoke-test the frozen app
        # --self-test: the speech stack and its voice detector, an offline
        # PDF from the bundled tectonic and cache, the main window driven
        # over MCP (--mcp-server), the bundled KhervePDF taking a PDF.
        shell: bash
        run: python packaging/smoke_test.py dist/KherveNote/KherveNote.exe --version "$VERSION"

      - name: Install silently, smoke-test the installed app, uninstall
        # The only place the installer itself is ever run: compiling it proves
        # the script parses, not that it installs. Per-user, so no elevation
        # is needed on the runner. Checks the files land, the .knote
        # association is written, the INSTALLED exe works (same smoke test),
        # and the uninstaller removes it again.
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "KherveNote-installed"
          $log = Join-Path $env:RUNNER_TEMP "install.log"
          $p = Start-Process -FilePath "dist\KherveNote-Setup-$env:VERSION.exe" `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir","/LOG=$log" `
            -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "installer exited $($p.ExitCode)" }
          if (-not (Test-Path "$dir\KherveNote.exe")) { Get-Content $log -Tail 40; throw "KherveNote.exe was not installed" }
          if (-not (Test-Path "$dir\KhervePDF\KhervePDF.exe")) { throw "the bundled KhervePDF was not installed" }
          if (-not (Test-Path "HKCU:\Software\Classes\.knote")) { throw ".knote association was not written" }
          python packaging/smoke_test.py "$dir\KherveNote.exe" --version $env:VERSION
          if ($LASTEXITCODE -ne 0) { throw "smoke test of the installed app failed" }
          Start-Process -FilePath "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          # Inno's uninstaller re-launches itself from %TEMP% and returns at once.
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\KherveNote.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\KherveNote.exe") { throw "the uninstaller did not remove the app" }
          if (Test-Path "HKCU:\Software\Classes\.knote") { throw "the uninstaller left the .knote association" }
          Write-Host "install / run / uninstall OK"

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: KherveNote-${{ env.VERSION }}-windows
          path: |
            dist/KherveNote-Setup-*.exe
            dist/KherveNote-Setup.exe
            dist/KherveNote-*-portable.zip
          if-no-files-found: error
